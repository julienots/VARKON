name: GRAFCET Ladder Lab - APK

on:
  push:
    paths:
      - 'grafcet-ladder-lab/**'
      - '.github/workflows/grafcet-ladder-lab-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: grafcet-ladder-lab
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - run: npm ci
      - run: npx cap sync android
      - run: chmod +x android/gradlew && cd android && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: grafcet-ladder-lab-apk
          path: grafcet-ladder-lab/android/app/build/outputs/apk/debug/app-debug.apk
